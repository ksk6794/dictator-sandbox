[/Script/EngineSettings.GameMapsSettings]
; No project map yet: the scenario runner spawns the floor, lights and body from C++.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/SandboxInteraction.SandboxGameMode

[/Script/Engine.PhysicsSettings]
; Synchronous physics, fixed 90 Hz frame, 2 substeps = 180 Hz simulation (see docs/PRD.md, "Solver and timing").
; MaxSubstepDeltaTime sits just above 1/180 s so a 1/90 s frame always splits into exactly 2 substeps.
bTickPhysicsAsync=False
bSubstepping=True
MaxSubstepDeltaTime=0.005560
MaxSubsteps=4

[/Script/Engine.RendererSettings]
r.AllowStaticLighting=True
; TAA, not the engine's default TSR: at the headset's 28-megapixel target TSR alone cost about 8.5 ms of GPU time.
r.AntiAliasingMethod=2

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[SystemSettings]
; Headset render target as a percentage of the size the OpenXR runtime asks for (3728 x 3800 per eye on
; PlayStation VR2 through SteamVR). 85 keeps the test scene at 7.5 ms of GPU time; 100 costs 10.6 ms.
xr.SecondaryScreenPercentage.HMDRenderTarget=85
